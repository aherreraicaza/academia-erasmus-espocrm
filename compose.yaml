name: academia-erasmus

services:
  db:
    image: mariadb:11.8.5
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  espocrm:
    image: espocrm:10.0.9
    restart: unless-stopped
    environment:
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      ESPOCRM_SITE_URL: http://localhost:8088
    volumes:
      - espo_data:/var/www/html/data
      - espo_custom:/var/www/html/custom
      - espo_client_custom:/var/www/html/client/custom
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s

  espocrm-daemon:
    image: espocrm:10.0.9
    restart: unless-stopped
    entrypoint: docker-daemon.sh
    volumes_from:
      - espocrm
    depends_on:
      espocrm:
        condition: service_healthy

  adminer:
    image: adminer:5.4.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  espo_data:
  espo_custom:
  espo_client_custom:
